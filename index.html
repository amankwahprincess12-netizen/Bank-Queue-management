<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Marks Calculator</h1>
    <p>Enter marks for three students.</p>

    <input type="number" id="mark1" placeholder="Student 1 mark" min="0" max="100">
    <input type="number" id="mark2" placeholder="Student 2 mark" min="0" max="100">
    <input type="number" id="mark3" placeholder="Student 3 mark" min="0" max="100">

    <button onclick="calculate()">Calculate</button>
    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
